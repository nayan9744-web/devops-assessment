apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-task

labels:
  - pairs:
      app.kubernetes.io/part-of: devops-task
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

# Secret is generated from a git-ignored file (copy secret.env.example -> secret.env).
secretGenerator:
  - name: devops-task-secret
    envs:
      - secret.env
    options:
      disableNameSuffixHash: true

images:
  - name: devops-task
    newTag: "1.0.0"
