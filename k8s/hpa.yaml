apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-task
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-task
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # % of the CPU *request* (50m)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # avoid flapping after short bursts
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
