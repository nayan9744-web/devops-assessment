apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task
  labels:
    app.kubernetes.io/name: devops-task
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below the desired replica count -> zero downtime
      maxSurge: 1         # bring up one new pod at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-task
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-task
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: devops-task
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: devops-task
      containers:
        - name: app
          image: devops-task:1.0.0 # tag is overridden by kustomize `images:` / `kustomize edit set image`
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # APP_VERSION is baked into the image at build time (Dockerfile ARG/ENV), so the
          # reported version always matches the running image tag.
          envFrom:
            - configMapRef:
                name: devops-task-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devops-task-secret
                  key: API_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give Service endpoints / ingress time to drop this pod before SIGTERM.
              # Native sleep action (K8s >= 1.30) because distroless has no /bin/sleep.
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
