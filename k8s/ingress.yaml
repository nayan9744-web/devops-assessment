apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-task
spec:
  ingressClassName: nginx
  rules:
    - host: devops-task.localtest.me   # *.localtest.me resolves to 127.0.0.1
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-task
                port:
                  name: http
