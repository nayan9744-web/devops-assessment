# Thresholds and `for` durations are explained in README.md -> "Alerting rules".
groups:
  - name: app
    rules:
      - alert: AppInstanceDown
        expr: up{job="app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "App instance {{ $labels.instance }} is down"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for more than 1 minute."

      - alert: AppHighErrorRate
        # Ratio of 5xx to all requests; the `> 1` guard avoids paging on 1 error out of 2 requests.
        expr: |
          (
            sum(rate(http_request_errors_total{job="app"}[5m]))
              /
            sum(rate(http_requests_total{job="app"}[5m]))
          ) > 0.05
          and sum(rate(http_requests_total{job="app"}[5m])) * 300 > 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate ({{ $value | humanizePercentage }})"
          description: "More than 5% of requests failed over the last 5 minutes."

      - alert: AppHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="app", path!="/metrics"}[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 500ms ({{ $value | humanizeDuration }})"

  - name: host
    rules:
      - alert: HostDiskUsageHigh
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full"

      - alert: HostHighCpuUsage
        expr: (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 90% for 10 minutes ({{ $value | printf \"%.1f\" }}%)"

      - alert: HostMemoryUsageHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory above 90% ({{ $value | printf \"%.1f\" }}%)"

  - name: containers
    rules:
      - alert: ContainerMemoryNearLimit
        expr: |
          (
            container_memory_working_set_bytes{name!=""}
              /
            (container_spec_memory_limit_bytes{name!=""} > 0)
          ) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} memory at {{ $value | printf \"%.1f\" }}% of its limit"
          description: "The container is close to being OOM-killed."

  - name: monitoring
    rules:
      - alert: MonitoringTargetDown
        expr: up{job=~"node-exporter|cadvisor|monitoring-stack"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Monitoring component {{ $labels.instance }} is down"
