global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: devops-task

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Drop series for the cgroup hierarchy itself; keep only named containers.
      - source_labels: [name]
        regex: ""
        action: drop

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: monitoring-stack
    static_configs:
      - targets: ["loki:3100", "alloy:12345", "grafana:3000", "alertmanager:9093"]
