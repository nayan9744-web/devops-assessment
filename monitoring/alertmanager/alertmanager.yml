# Bonus: route alerts to Slack. The webhook URL is injected at start-up from $SLACK_WEBHOOK_URL
# (see docker-compose.monitoring.yml) and is never stored in git.
global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: slack
      repeat_interval: 1h

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /tmp/slack_webhook_url
        channel: "#alerts"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'

inhibit_rules:
  # If the app is down, don't also alert on its error rate / latency.
  - source_matchers: [alertname="AppInstanceDown"]
    target_matchers: [alertname=~"AppHighErrorRate|AppHighLatencyP95"]
